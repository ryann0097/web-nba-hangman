name: Smart CI/CD with AI Advisor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  quality-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essencial para o history_analyzer poder calcular churn e commits

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 4. Executa Testes e Sensores de Qualidade (JaCoCo + Checkstyle)
      - name: 4. Run Tests & Static Analysis (JaCoCo & Checkstyle)
        run: |
          ./mvnw clean test jacoco:report checkstyle:checkstyle

      # 5. Executa os analisadores do Laboratório
      - name: 5. Analyze Git History & Churn
        run: |
          python3 tools/history_analyzer.py

      - name: 6. Build Unified Quality Report
        run: |
          python3 tools/build_report.py

      # 7. Invoca o AI Advisor
      - name: 7. Run AI Quality Advisor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 tools/ai_advisor.py

      # 8. Comenta no PR (se o evento for Pull Request)
      - name: 8. Comment PR with AI Feedback
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('target/pr_comment.md')) {
              const comment = fs.readFileSync('target/pr_comment.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      # 9. Publica Artefatos de Qualidade
      - name: 9. Upload Quality Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-artifacts
          path: |
            target/quality_report.json
            target/ai_advice.json
            target/pr_comment.md
            target/site/jacoco/
            target/checkstyle-result.xml
