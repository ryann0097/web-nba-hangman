spring:
  application:
    name: nba
  datasource:
    url: jdbc:h2:mem:nbadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: ${JWT_SECRET:nbaHangmanSecretKeyForJwtTokenGenerationSecurityKey2026Secure!}
  expirationMs: 86400000 # 24 horas
